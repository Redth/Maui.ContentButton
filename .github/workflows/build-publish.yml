name: Build and Publish

on:
  pull_request:
  push:
    branches: [ main ]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build
    env:
      NUPKG_MAJOR: 0.999
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Setup Workloads
      run: dotnet workload install maui --version 8.0.407
    - name: Build
      run: dotnet build --configuration Release
    - name: Package NuGets
      shell: pwsh
      run: |
        $VERSION="$env:NUPKG_MAJOR-ci$env:GITHUB_RUN_ID"
        if ($env:GITHUB_EVENT_NAME -eq "release") {
          $VERSION = $env:GITHUB_REF.Substring($env:GITHUB_REF.LastIndexOf('/') + 1)
        }
        echo "PACKAGE VERSION: $VERSION"
        
        New-Item -ItemType Directory -Force -Path .\artifacts
        dotnet pack --output ./artifacts --configuration Release -p:PackageVersion=$VERSION ./Maui.ContentButton/Maui.ContentButton.csproj
        
    - name: Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NuGet
        path: ./artifacts

  publish:
    name: Publish
    needs: [build, desktop]
    runs-on: windows-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: NuGet*
          merge-multiple: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: NuGet login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY"

  desktop:
    name: Desktop (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: Gtk4
            os: ubuntu-latest
          - backend: MacOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      NUPKG_MAJOR: 0.999
    defaults:
      run:
        working-directory: Backends
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Select Xcode
        if: matrix.backend == 'MacOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Install macOS workload
        if: matrix.backend == 'MacOS'
        run: dotnet workload install macos --version 10.0.203
      - name: Install GTK runtime
        if: matrix.backend == 'Gtk4'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4 xvfb
      - name: Test shared desktop behavior
        run: dotnet test Tests/Maui.ContentButton.Backends.Tests.csproj --configuration Release
      - name: Build native sample
        run: dotnet build Samples/${{ matrix.backend }}/ContentButton.${{ matrix.backend }}.Sample.csproj --configuration Release
      - name: Exercise GTK native handler
        if: matrix.backend == 'Gtk4'
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: xvfb-run -a dotnet run --project Samples/Gtk4/ContentButton.Gtk4.Sample.csproj --configuration Release --no-build -- --smoke-test
      - name: Exercise AppKit native handler
        if: matrix.backend == 'MacOS'
        shell: bash
        run: |
          "Samples/MacOS/bin/Release/net10.0-macos/ContentButton AppKit.app/Contents/MacOS/ContentButton.MacOS.Sample" --smoke-test
      - name: Package companion NuGet
        shell: pwsh
        run: |
          $VERSION="$env:NUPKG_MAJOR-ci$env:GITHUB_RUN_ID"
          if ($env:GITHUB_EVENT_NAME -eq "release") {
            $VERSION = $env:GITHUB_REF.Substring($env:GITHUB_REF.LastIndexOf('/') + 1)
          }
          dotnet pack ${{ matrix.backend }}/Maui.ContentButton.${{ matrix.backend }}.csproj --configuration Release --output ../artifacts -p:PackageVersion=$VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuGet-${{ matrix.backend }}
          path: ./artifacts
